# Production-safe defaults: no profile active, no seed data, no dev tokens, no Swagger UI.
# Local development runs with the dev profile (see application-dev.yml and `./gradlew bootRun`).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  threads:
    virtual:
      # Each request runs on a virtual thread: blocking JDBC calls park it cheaply instead of holding a platform
      # thread, so thread-per-request scales without a reactive stack.
      enabled: true
  jackson:
    deserialization:
      # Unknown request fields are rejected (400), never silently ignored.
      fail-on-unknown-properties: true

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

app:
  # Request body cap (see RequestBodyLimitFilter). The largest valid body (post: 5000 chars + 10 image URLs) is well
  # under it.
  max-request-body: 64KB
  jwt:
    # HS256 key, at least 32 bytes. No default: the application refuses to start without it.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:blocking-restcontroller-demo}
    audience: ${JWT_AUDIENCE:blocking-restcontroller-demo-api}
    ttl: 15m
