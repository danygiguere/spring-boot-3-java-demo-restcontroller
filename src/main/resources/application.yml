# Single config for every environment. Defaults are production-safe: no seed data, no dev tokens, no Swagger UI.
# Local values come from .env (see .env.example); deployed environments set real environment variables.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_INITIAL_SIZE:5}
      # Per instance: instances × maximum-pool-size must stay under PostgreSQL max_connections.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      # Fail fast (500) instead of queueing requests forever when every connection is busy.
      connection-timeout: ${DB_POOL_MAX_ACQUIRE_TIME_MS:5000}
      idle-timeout: ${DB_POOL_MAX_IDLE_TIME_MS:600000}
      # Recycled before network devices or PostgreSQL drop them.
      max-lifetime: ${DB_POOL_MAX_LIFE_TIME_MS:1800000}
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:5}
        # Server-side cancel of any statement or lock wait running longer. Flyway has its own connection below.
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT:5s} -c lock_timeout=${DB_LOCK_WAIT_TIMEOUT:2s}"
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Local: add classpath:db/seed (R__dev_seed.sql EMPTIES the tables before filling them).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  threads:
    virtual:
      # Each request runs on a virtual thread: blocking JDBC calls park it cheaply instead of holding a platform
      # thread, so thread-per-request scales without a reactive stack.
      enabled: true
  jackson:
    deserialization:
      # Unknown request fields are rejected (400), never silently ignored.
      fail-on-unknown-properties: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  # Empty = all interfaces. DEV_TOKEN_ENABLED requires 127.0.0.1.
  address: ${SERVER_ADDRESS:}

app:
  # Request body cap (see RequestBodyLimitFilter). The largest valid body (post: 5000 chars + 10 image URLs) is well
  # under it.
  max-request-body: 64KB
  jwt:
    # HS256 key, at least 32 bytes. No default: the application refuses to start without it.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:blocking-restcontroller-demo}
    audience: ${JWT_AUDIENCE:blocking-restcontroller-demo-api}
    ttl: ${JWT_TTL:15m}
  dev-token:
    # Passwordless POST /auth/dev-token. Local only.
    enabled: ${DEV_TOKEN_ENABLED:false}
